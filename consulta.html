<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Orçamento Pessoal · Consulta</title>

    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <meta name="color-scheme" content="light dark">
    <script>
        (function () {
            var mq = matchMedia('(prefers-color-scheme: dark)');
            function aplicar() { document.documentElement.setAttribute('data-bs-theme', mq.matches ? 'dark' : 'light'); }
            aplicar();
            mq.addEventListener('change', aplicar);
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body data-pagina="consulta">

    <nav class="navbar navbar-expand-md app-nav sticky-top mb-4">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                <img src="logo.svg" width="32" height="32" alt="">
                Orçamento Pessoal
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
                aria-controls="menu" aria-expanded="false" aria-label="Abrir menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html"><i class="bi bi-plus-circle"></i> Cadastro</a></li>
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="consulta.html"><i class="bi bi-search"></i> Consulta</a></li>
                    <li class="nav-item"><a class="nav-link" href="resumo.html"><i class="bi bi-pie-chart"></i> Resumo</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container pb-5">
        <div class="card mb-4">
            <div class="card-body p-4">
                <h1 class="pagina-titulo">Consulta de despesas</h1>
                <p class="pagina-sub mb-4">Filtre, edite ou exporte seus lançamentos.</p>

                <form id="formFiltros">
                    <div class="row g-3">
                        <div class="col-6 col-md-2">
                            <label for="ano" class="form-label">Ano</label>
                            <select class="form-select" id="ano"></select>
                        </div>
                        <div class="col-6 col-md-3">
                            <label for="mes" class="form-label">Mês</label>
                            <select class="form-select" id="mes"></select>
                        </div>
                        <div class="col-4 col-md-2">
                            <label for="dia" class="form-label">Dia</label>
                            <input type="number" class="form-control" id="dia" min="1" max="31" placeholder="Todos">
                        </div>
                        <div class="col-8 col-md-5">
                            <label for="tipo" class="form-label">Tipo</label>
                            <select class="form-select" id="tipo"></select>
                        </div>
                        <div class="col-md-6">
                            <label for="descricao" class="form-label">Descrição contém</label>
                            <input type="search" class="form-control" id="descricao" placeholder="Ex.: mercado">
                        </div>
                        <div class="col-6 col-md-3">
                            <label for="valorMin" class="form-label">Valor mínimo</label>
                            <input type="text" inputmode="decimal" class="form-control" id="valorMin" placeholder="0,00">
                        </div>
                        <div class="col-6 col-md-3">
                            <label for="valorMax" class="form-label">Valor máximo</label>
                            <input type="text" inputmode="decimal" class="form-control" id="valorMax" placeholder="0,00">
                        </div>
                    </div>
                    <div class="d-flex flex-wrap gap-2 justify-content-end mt-3">
                        <button type="button" class="btn btn-outline-secondary" id="btnLimpar">
                            <i class="bi bi-x-lg"></i> Limpar filtros
                        </button>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-search"></i> Pesquisar
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="card-header d-flex flex-wrap gap-2 justify-content-between align-items-center">
                <div>
                    <span class="card-titulo" id="qtdFiltrada">0 despesas</span>
                    <span class="text-body-secondary">· total</span>
                    <span class="fw-semibold" id="totalFiltrado">R$ 0,00</span>
                </div>
                <button type="button" class="btn btn-sm btn-suave" id="btnExportar">
                    <i class="bi bi-filetype-csv"></i> Exportar CSV
                </button>
            </div>
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th scope="col">Data</th>
                            <th scope="col">Tipo</th>
                            <th scope="col">Descrição</th>
                            <th scope="col" class="text-end">Valor</th>
                            <th scope="col" class="text-end"><span class="visually-hidden">Ações</span></th>
                        </tr>
                    </thead>
                    <tbody id="listaDespesas"></tbody>
                </table>
            </div>
            <div class="estado-vazio d-none" id="semResultados"></div>
        </div>
    </main>

    <!-- Modal de edição -->
    <div class="modal fade" id="modalEdicao" tabindex="-1" aria-labelledby="tituloEdicao" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <form class="modal-content" id="formEdicao" novalidate>
                <div class="modal-header">
                    <h2 class="modal-title fs-5" id="tituloEdicao">Editar despesa</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-sm-6">
                            <label for="editData" class="form-label">Data</label>
                            <input type="date" class="form-control" id="editData">
                            <div class="invalid-feedback" id="editDataErro"></div>
                        </div>
                        <div class="col-sm-6">
                            <label for="editTipo" class="form-label">Tipo</label>
                            <select class="form-select" id="editTipo"></select>
                            <div class="invalid-feedback" id="editTipoErro"></div>
                        </div>
                        <div class="col-12">
                            <label for="editDescricao" class="form-label">Descrição</label>
                            <input type="text" class="form-control" id="editDescricao" maxlength="100">
                            <div class="invalid-feedback" id="editDescricaoErro"></div>
                        </div>
                        <div class="col-sm-6">
                            <label for="editValor" class="form-label">Valor</label>
                            <div class="input-group has-validation">
                                <span class="input-group-text">R$</span>
                                <input type="text" inputmode="decimal" class="form-control text-end" id="editValor">
                                <div class="invalid-feedback" id="editValorErro"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar alterações</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal de confirmação de exclusão -->
    <div class="modal fade" id="modalExclusao" tabindex="-1" aria-labelledby="tituloExclusao" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title fs-5" id="tituloExclusao">Excluir despesa</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body" id="textoExclusao"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-danger" id="btnConfirmarExclusao">Excluir</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>

</html>
