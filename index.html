<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Orçamento Pessoal · Cadastro</title>

    <meta name="color-scheme" content="light dark">
    <script>
        (function () {
            var mq = matchMedia('(prefers-color-scheme: dark)');
            function aplicar() { document.documentElement.setAttribute('data-bs-theme', mq.matches ? 'dark' : 'light'); }
            aplicar();
            mq.addEventListener('change', aplicar);
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body data-pagina="cadastro">

    <nav class="navbar navbar-expand-md app-nav sticky-top mb-4">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                <img src="logo.png" width="32" height="32" alt="">
                Orçamento Pessoal
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
                aria-controls="menu" aria-expanded="false" aria-label="Abrir menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="index.html"><i class="bi bi-plus-circle"></i> Cadastro</a></li>
                    <li class="nav-item"><a class="nav-link" href="consulta.html"><i class="bi bi-search"></i> Consulta</a></li>
                    <li class="nav-item"><a class="nav-link" href="resumo.html"><i class="bi bi-pie-chart"></i> Resumo</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container pb-5">
        <div class="row g-4">
            <section class="col-lg-7">
                <div class="card">
                    <div class="card-body p-4">
                        <h1 class="pagina-titulo">Nova despesa</h1>
                        <p class="pagina-sub mb-4">Registre um gasto para acompanhar seu orçamento.</p>

                        <form id="formCadastro" novalidate>
                            <div class="row g-3">
                                <div class="col-sm-6">
                                    <label for="data" class="form-label">Data</label>
                                    <input type="date" class="form-control" id="data" required>
                                    <div class="invalid-feedback" id="dataErro"></div>
                                </div>
                                <div class="col-sm-6">
                                    <label for="tipo" class="form-label">Tipo</label>
                                    <select class="form-select" id="tipo" required></select>
                                    <div class="invalid-feedback" id="tipoErro"></div>
                                </div>
                                <div class="col-sm-8">
                                    <label for="descricao" class="form-label">Descrição</label>
                                    <input type="text" class="form-control" id="descricao" maxlength="100"
                                        placeholder="Ex.: Supermercado" autocomplete="off" required>
                                    <div class="invalid-feedback" id="descricaoErro"></div>
                                </div>
                                <div class="col-sm-4">
                                    <label for="valor" class="form-label">Valor</label>
                                    <div class="input-group has-validation">
                                        <span class="input-group-text">R$</span>
                                        <input type="text" inputmode="decimal" class="form-control text-end" id="valor"
                                            placeholder="0,00" autocomplete="off" required>
                                        <div class="invalid-feedback" id="valorErro"></div>
                                    </div>
                                </div>
                            </div>

                            <div class="d-flex justify-content-end mt-4">
                                <button type="submit" class="btn btn-primary px-4">
                                    <i class="bi bi-plus-lg"></i> Adicionar despesa
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </section>

            <aside class="col-lg-5">
                <div class="card card-destaque mb-4">
                    <div class="card-body p-4">
                        <div class="rotulo">Gasto em <span id="nomeMesAtual"></span></div>
                        <div class="valor-destaque mb-2" id="totalMesAtual">R$ 0,00</div>
                        <a href="resumo.html">Ver resumo do mês <i class="bi bi-arrow-right"></i></a>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h2 class="card-titulo">Últimos lançamentos</h2>
                        <a href="consulta.html" class="small">Ver todos</a>
                    </div>
                    <ul class="list-group list-group-flush" id="ultimasDespesas"></ul>
                </div>
            </aside>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>

</html>
